name: Falix Auto Start

on:
  schedule:
    # 每天 02:17 UTC 运行一次
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  start-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 fonts-liberation

      - name: Cache Chrome
        id: cache-chrome
        uses: actions/cache@v5
        with:
          path: /tmp/chrome-cache
          key: chrome-ubuntu24-v1

      - name: Install Chrome
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          rm -f google-chrome-stable_current_amd64.deb
          mkdir -p /tmp/chrome-cache
          sudo cp -a /opt/google/chrome/. /tmp/chrome-cache/
          sudo chown -R $(whoami) /tmp/chrome-cache
          google-chrome --version

      - name: Link Chrome
        if: steps.cache-chrome.outputs.cache-hit == 'true'
        run: |
          sudo mkdir -p /opt/google/chrome
          sudo cp -a /tmp/chrome-cache/. /opt/google/chrome/
          sudo ln -sf /opt/google/chrome/google-chrome /usr/bin/google-chrome
          sudo ln -sf /opt/google/chrome/google-chrome /usr/bin/google-chrome-stable
          google-chrome --version

      - name: Cache Mihomo
        id: cache-mihomo
        if: env.HAS_PROXY == 'true'
        env:
          HAS_PROXY: ${{ secrets.PROXY_URL != '' }}
        uses: actions/cache@v5
        with:
          path: /tmp/mihomo-bin
          key: mihomo-v1

      - name: Setup Multi-Protocol Proxy
        if: env.PROXY_URL != ''
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_FILTER: ${{ secrets.PROXY_FILTER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/mihomo-bin /tmp/mihomo
          if [ ! -x /tmp/mihomo-bin/mihomo ]; then
            echo "Downloading mihomo..."
            DL_URL=$(python3 - << 'PYEOF'
          import urllib.request, json, re, os
          req = urllib.request.Request('https://api.github.com/repos/MetaCubeX/mihomo/releases/latest')
          tok = os.environ.get('GITHUB_TOKEN')
          if tok:
              req.add_header('Authorization', f'Bearer {tok}')
          try:
              data = json.loads(urllib.request.urlopen(req, timeout=15).read())
              for pat in [r'^mihomo-linux-amd64-compatible-v[\d.]+\.gz$', r'^mihomo-linux-amd64-v[\d.]+\.gz$']:
                  for a in data.get('assets', []):
                      if re.match(pat, a['name']):
                          print(a['browser_download_url'])
                          raise SystemExit(0)
          except Exception:
              pass
          print('https://github.com/MetaCubeX/mihomo/releases/download/v1.19.16/mihomo-linux-amd64-compatible-v1.19.16.gz')
          PYEOF
            )
            curl -fsSL "$DL_URL" | gunzip > /tmp/mihomo-bin/mihomo
            chmod +x /tmp/mihomo-bin/mihomo
          fi

          python3 - << 'PYEOF'
          import os, re, json, base64, urllib.request
          from urllib.parse import urlparse, parse_qs, unquote

          raw_input = os.environ.get('PROXY_URL', '').strip()
          if not raw_input:
              raise SystemExit(0)

          def b64dec(s):
              s = s.strip().replace('-', '+').replace('_', '/')
              pad = len(s) % 4
              if pad:
                  s += '=' * (4 - pad)
              return base64.b64decode(s).decode('utf-8', errors='ignore')

          used_names = set()
          def unique_name(base):
              base = re.sub(r'[\r\n\t]+', ' ', (base or 'node')).strip()[:40] or 'node'
              name = base
              idx = 2
              while name in used_names:
                  name = f"{base}_{idx}"
                  idx += 1
              used_names.add(name)
              return name

          def parse_uri(uri):
              uri = uri.strip()
              if not uri:
                  return None
              try:
                  if uri.startswith('vmess://'):
                      d = json.loads(b64dec(uri[8:]))
                      net = d.get('net', 'tcp')
                      tls = str(d.get('tls', '')).lower() in ('tls', '1', 'true')
                      p = {
                          'name': unique_name(d.get('ps', 'vmess')),
                          'type': 'vmess',
                          'server': d['add'],
                          'port': int(d['port']),
                          'uuid': d['id'],
                          'alterId': int(d.get('aid', 0)),
                          'cipher': d.get('scy') or d.get('security') or 'auto',
                          'udp': True,
                          'tls': tls,
                          'skip-cert-verify': True,
                          'network': net,
                          'client-fingerprint': d.get('fp') or 'chrome',
                      }
                      if d.get('sni') or d.get('host'):
                          p['servername'] = d.get('sni') or d.get('host')
                      if net == 'ws':
                          ws = {'path': d.get('path') or '/'}
                          if d.get('host'):
                              ws['headers'] = {'Host': d['host']}
                          p['ws-opts'] = ws
                      elif net == 'grpc':
                          p['grpc-opts'] = {'grpc-service-name': d.get('path') or ''}
                      return p

                  u = urlparse(uri)
                  scheme = u.scheme.lower()
                  q = {k: v[0] for k, v in parse_qs(u.query).items()}
                  tag = unquote(u.fragment) if u.fragment else scheme
                  host = u.hostname
                  port = u.port
                  if not host or not port:
                      return None

                  if scheme == 'vless':
                      sec = q.get('security', 'none').lower()
                      net = q.get('type', 'tcp').lower()
                      p = {
                          'name': unique_name(tag),
                          'type': 'vless',
                          'server': host,
                          'port': int(port),
                          'uuid': unquote(u.username or ''),
                          'udp': True,
                          'tls': sec in ('tls', 'reality'),
                          'skip-cert-verify': q.get('allowInsecure') in ('1', 'true') or q.get('insecure') in ('1', 'true'),
                          'network': net,
                          'client-fingerprint': q.get('fp') or 'chrome',
                      }
                      if q.get('sni') or q.get('peer'):
                          p['servername'] = q.get('sni') or q.get('peer')
                      if q.get('flow'):
                          p['flow'] = q['flow']
                      if q.get('alpn'):
                          p['alpn'] = [x.strip() for x in q['alpn'].split(',') if x.strip()]
                      if sec == 'reality':
                          p['reality-opts'] = {
                              'public-key': q.get('pbk', ''),
                              'short-id': q.get('sid', ''),
                          }
                      if net == 'ws':
                          ws = {'path': q.get('path') or '/'}
                          if q.get('host'):
                              ws['headers'] = {'Host': q['host']}
                          p['ws-opts'] = ws
                      elif net == 'grpc':
                          p['grpc-opts'] = {'grpc-service-name': q.get('serviceName', '')}
                      return p

                  if scheme == 'trojan':
                      net = q.get('type', 'tcp').lower()
                      p = {
                          'name': unique_name(tag),
                          'type': 'trojan',
                          'server': host,
                          'port': int(port),
                          'password': unquote(u.username or ''),
                          'udp': True,
                          'sni': q.get('sni') or q.get('peer') or host,
                          'skip-cert-verify': q.get('allowInsecure') in ('1', 'true') or q.get('insecure') in ('1', 'true'),
                          'client-fingerprint': q.get('fp') or 'chrome',
                          'network': net,
                      }
                      if net == 'ws':
                          ws = {'path': q.get('path') or '/'}
                          if q.get('host'):
                              ws['headers'] = {'Host': q['host']}
                          p['ws-opts'] = ws
                      elif net == 'grpc':
                          p['grpc-opts'] = {'grpc-service-name': q.get('serviceName', '')}
                      return p

                  if scheme in ('hysteria2', 'hy2'):
                      pw = unquote(u.username or '')
                      if u.password:
                          pw = f"{pw}:{unquote(u.password)}"
                      p = {
                          'name': unique_name(tag),
                          'type': 'hysteria2',
                          'server': host,
                          'port': int(port),
                          'password': pw,
                          'skip-cert-verify': q.get('insecure') in ('1', 'true') or q.get('allowInsecure') in ('1', 'true'),
                          'alpn': [x.strip() for x in q.get('alpn', 'h3').split(',') if x.strip()],
                      }
                      if q.get('sni') or q.get('peer'):
                          p['sni'] = q.get('sni') or q.get('peer')
                      if q.get('obfs') and q.get('obfs') != 'none':
                          p['obfs'] = q['obfs']
                          p['obfs-password'] = q.get('obfs-password', '')
                      return p

                  if scheme == 'tuic':
                      p = {
                          'name': unique_name(tag),
                          'type': 'tuic',
                          'server': host,
                          'port': int(port),
                          'uuid': unquote(u.username or ''),
                          'password': unquote(u.password or ''),
                          'congestion-controller': q.get('congestion_control', 'bbr'),
                          'udp-relay-mode': q.get('udp_relay_mode', 'native'),
                          'alpn': [x.strip() for x in q.get('alpn', 'h3').split(',') if x.strip()],
                          'skip-cert-verify': q.get('allow_insecure') in ('1', 'true') or q.get('insecure') in ('1', 'true'),
                      }
                      if q.get('sni'):
                          p['sni'] = q['sni']
                      return p

                  if scheme == 'anytls':
                      sec = q.get('security', 'tls').lower()
                      p = {
                          'name': unique_name(tag),
                          'type': 'anytls',
                          'server': host,
                          'port': int(port),
                          'password': unquote(u.username or ''),
                          'client-fingerprint': q.get('fp') or 'chrome',
                          'skip-cert-verify': q.get('insecure') in ('1', 'true') or q.get('allowInsecure') in ('1', 'true'),
                      }
                      if q.get('sni'):
                          p['sni'] = q['sni']
                      if sec == 'reality':
                          p['reality-opts'] = {
                              'public-key': q.get('pbk', ''),
                              'short-id': q.get('sid', ''),
                          }
                      return p

                  if scheme == 'ss':
                      raw_ss = uri[5:].split('#')[0]
                      if '@' in raw_ss:
                          userinfo, serverpart = raw_ss.split('@', 1)
                          if ':' not in userinfo:
                              userinfo = b64dec(userinfo)
                      else:
                          decoded = b64dec(raw_ss)
                          userinfo, serverpart = decoded.rsplit('@', 1)
                      method, pw = userinfo.split(':', 1)
                      h, pt = serverpart.split('?')[0].rsplit(':', 1)
                      return {
                          'name': unique_name(tag),
                          'type': 'ss',
                          'server': h.strip('[]'),
                          'port': int(pt),
                          'cipher': method,
                          'password': pw,
                          'udp': True,
                      }

                  if scheme in ('socks', 'socks5', 'http', 'https'):
                      ptype = 'http' if scheme in ('http', 'https') else 'socks5'
                      p = {
                          'name': unique_name(tag),
                          'type': ptype,
                          'server': host,
                          'port': int(port),
                      }
                      if u.username and not u.password:
                          try:
                              dec_auth = b64dec(unquote(u.username))
                              if ':' in dec_auth:
                                  p['username'], p['password'] = dec_auth.split(':', 1)
                              else:
                                  p['username'] = unquote(u.username)
                          except Exception:
                              p['username'] = unquote(u.username)
                      elif u.username:
                          p['username'] = unquote(u.username)
                          if u.password:
                              p['password'] = unquote(u.password)
                      return p
              except Exception as e:
                  print(f"Skip invalid URI ({uri[:20]}...): {e}")
              return None

          proxies = []
          lines = [x.strip() for x in re.split(r'[\r\n]+', raw_input) if x.strip()]

          if len(lines) == 1 and re.match(r'^https?://', lines[0]) and '@' not in lines[0]:
              print("Fetching subscription URL...")
              req = urllib.request.Request(lines[0], headers={'User-Agent': 'clash-verge/v2.0.0'})
              body = urllib.request.urlopen(req, timeout=20).read().decode('utf-8', errors='ignore').strip()
              if 'proxies:' in body:
                  import subprocess, sys
                  subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', 'pyyaml'], check=True)
                  import yaml
                  sub_cfg = yaml.safe_load(body)
                  for item in (sub_cfg or {}).get('proxies', []):
                      nm = item.get('name', '')
                      if any(k in nm for k in ['剩余', '到期', '套餐', '官网', 'Traffic', 'Expire', '重置']):
                          continue
                      item['name'] = unique_name(nm)
                      proxies.append(item)
              else:
                  try:
                      decoded_sub = b64dec(body)
                      if '://' in decoded_sub:
                          body = decoded_sub
                  except Exception:
                      pass
                  for line in re.split(r'[\r\n]+', body):
                      p = parse_uri(line)
                      if p:
                          proxies.append(p)
          else:
              for line in lines:
                  p = parse_uri(line)
                  if p:
                      proxies.append(p)

          if not proxies:
              raise SystemExit("ERROR: PROXY_URL 未能解析出任何有效节点！")

          proxy_names = [p['name'] for p in proxies]
          prefer_pat = os.environ.get('PROXY_FILTER', '').strip() or r'住宅|家宽|原生|ISP|Residential'
          preferred_names = [n for n in proxy_names if re.search(prefer_pat, n, re.I)]

          proxy_groups = []
          if preferred_names:
              print(f"Prioritizing residential/filtered nodes ({len(preferred_names)}): {', '.join(preferred_names[:5])}")
              proxy_groups.append({
                  'name': 'PREFERRED',
                  'type': 'url-test',
                  'proxies': preferred_names,
                  'url': 'https://www.gstatic.com/generate_204',
                  'interval': 300,
              })
              proxy_groups.append({
                  'name': 'ALL',
                  'type': 'url-test',
                  'proxies': proxy_names,
                  'url': 'https://www.gstatic.com/generate_204',
                  'interval': 300,
              })
              proxy_groups.append({
                  'name': 'AUTO',
                  'type': 'fallback',
                  'proxies': ['PREFERRED', 'ALL'],
                  'url': 'https://www.gstatic.com/generate_204',
                  'interval': 300,
              })
          else:
              proxy_groups.append({
                  'name': 'AUTO',
                  'type': 'url-test',
                  'proxies': proxy_names,
                  'url': 'https://www.gstatic.com/generate_204',
                  'interval': 300,
              })

          config = {
              'mixed-port': 10808,
              'allow-lan': False,
              'mode': 'rule',
              'log-level': 'warning',
              'ipv6': True,
              'dns': {
                  'enable': True,
                  'enhanced-mode': 'fake-ip',
                  'nameserver': ['1.1.1.1', '8.8.8.8'],
              },
              'proxies': proxies,
              'proxy-groups': proxy_groups,
              'rules': ['MATCH,AUTO'],
          }

          with open('/tmp/mihomo/config.json', 'w', encoding='utf-8') as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
          print(f"Successfully loaded {len(proxies)} proxy node(s)")
          PYEOF

          nohup /tmp/mihomo-bin/mihomo -d /tmp/mihomo -f /tmp/mihomo/config.json >/tmp/mihomo/mihomo.log 2>&1 &
          sleep 4
          EXIT_IP=$(curl -s --max-time 15 -x socks5h://127.0.0.1:10808 https://api.ipify.org || true)
          if [ -z "$EXIT_IP" ]; then
            cat /tmp/mihomo/mihomo.log || true
            echo "Proxy connectivity check failed!"
            exit 1
          fi
          echo "Proxy connected! Browser Exit IP: $EXIT_IP"
          echo "BROWSER_PROXY=socks5://127.0.0.1:10808" >> $GITHUB_ENV

      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: npm-patchright-v1

      - name: Install Patchright
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm init -y && npm install patchright@1.51.0

      - name: Restore cookies
        id: restore-cookies
        uses: actions/cache/restore@v5
        with:
          path: cookies.json
          key: falix-cookies-${{ github.run_id }}
          restore-keys: falix-cookies-

      - name: Write script
        run: |
          python3 - << 'PYEOF'
          script = r"""
          import { chromium } from 'patchright';
          import fs from 'fs';

          let fatalCdp = '';
          process.on('unhandledRejection', reason => {
            const msg = (reason && reason.message) ? reason.message : String(reason);
            console.error('unhandledRejection: ' + msg);
            if (/ProtocolError|timed out|Target closed|Connection closed|Session closed/i.test(msg)) fatalCdp = msg;
          });
          process.on('uncaughtException', err => {
            const msg = (err && err.message) ? err.message : String(err);
            console.error('uncaughtException: ' + msg);
            fatalCdp = msg;
          });

          const EMAIL      = process.env.FALIX_EMAIL;
          const PASSWORD   = process.env.FALIX_PASSWORD;
          const SERVER_ID  = process.env.FALIX_SERVER_ID;
          if (!SERVER_ID) { console.error('FALIX_SERVER_ID 未设置，请在 Settings→Secrets 配置'); process.exit(1); }
          const TG_TOKEN   = process.env.TG_TOKEN;
          const TG_CHAT_ID = process.env.TG_CHAT_ID;
          const LOGIN_URL  = 'https://client.falixnodes.net/auth/login';
          const SERVER_URL = `https://client.falixnodes.net/server/${SERVER_ID}/console`;
          const TIMER_URL  = `https://client.falixnodes.net/timer?id=${SERVER_ID}`;
          const COOKIES_PATH = process.env.COOKIES_PATH || '';

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const START = Date.now();

          async function checkTime(label) {
            const elapsed = Date.now() - START;
            console.log(`${label}: ${Math.round(elapsed/1000)}s`);
          }

          function sanitizeCookies(rawList, stripCf = false) {
            return rawList
              .filter(c => c && typeof c === 'object' && c.name && c.value !== undefined)
              .filter(c => !stripCf || !['cf_clearance', '__cf_bm'].includes(String(c.name)))
              .map(c => {
                const out = {
                  name: String(c.name),
                  value: String(c.value),
                };
                if (c.url) out.url = String(c.url);
                if (c.domain) out.domain = String(c.domain);
                if (c.path) out.path = String(c.path);
                if (typeof c.expires === 'number' && c.expires > 0) out.expires = c.expires;
                else if (typeof c.expirationDate === 'number' && c.expirationDate > 0) out.expires = c.expirationDate;
                if (typeof c.httpOnly === 'boolean') out.httpOnly = c.httpOnly;
                if (typeof c.secure === 'boolean') out.secure = c.secure;
                if (['Strict', 'Lax', 'None'].includes(c.sameSite)) out.sameSite = c.sameSite;
                return out;
              });
          }

          async function loadCookies(context, forceSecret = false) {
            if (!COOKIES_PATH) return false;
            try {
              let fromSecret = false;
              if (forceSecret) {
                if (!process.env.FALIX_COOKIES) return false;
                fs.writeFileSync(COOKIES_PATH, process.env.FALIX_COOKIES.trim());
                fromSecret = true;
                console.log('已使用 FALIX_COOKIES Secret 覆盖本地缓存');
              } else if (!fs.existsSync(COOKIES_PATH) && process.env.FALIX_COOKIES) {
                fs.writeFileSync(COOKIES_PATH, process.env.FALIX_COOKIES.trim());
                fromSecret = true;
                console.log('已从 FALIX_COOKIES Secret 初始化 cookie 文件');
              }
              if (!fs.existsSync(COOKIES_PATH)) return false;
              const data = fs.readFileSync(COOKIES_PATH, 'utf8');
              const cookies = JSON.parse(data);
              if (!Array.isArray(cookies) || cookies.length === 0) return false;
              const cleanCookies = sanitizeCookies(cookies, fromSecret);
              if (cleanCookies.length === 0) return false;
              await context.addCookies(cleanCookies);
              console.log('已加载 ' + cleanCookies.length + ' 个 cookie');
              return true;
            } catch(e) {
              console.log('加载 cookie 失败: ' + e.message);
              return false;
            }
          }

          async function saveCookies(context) {
            if (!COOKIES_PATH) return;
            try {
              const cookies = await context.cookies();
              fs.writeFileSync(COOKIES_PATH, JSON.stringify(cookies, null, 2));
              console.log('已保存 ' + cookies.length + ' 个 cookie');
            } catch(e) {
              console.log('保存 cookie 失败: ' + e.message);
            }
          }
          fs.mkdirSync('/tmp/ss', { recursive: true });

          async function shot(page, name) {
            try {
              await page.screenshot({ path: `/tmp/ss/${name}.png`, fullPage: true, timeout: 15000 });
              console.log('shot:' + name);
            } catch(e) { console.log('shot fail ' + name + ': ' + e.message); }
          }

          async function tg(msg) {
            if (!TG_TOKEN || !TG_CHAT_ID) return;
            try {
              await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ chat_id: TG_CHAT_ID, text: msg, parse_mode:'HTML' })
              });
            } catch {}
          }

          async function humanClick(page, x, y) {
            await page.mouse.move(x - 18 + Math.random() * 10, y - 12 + Math.random() * 8, { steps: 8 });
            await sleep(80 + Math.random() * 90);
            await page.mouse.move(x, y, { steps: 6 });
            await sleep(70 + Math.random() * 80);
            await page.mouse.down();
            await sleep(60 + Math.random() * 60);
            await page.mouse.up();
          }

          async function clickBtn(page, label) {
            return page.evaluate(lbl => {
              const b = [...document.querySelectorAll('button')]
                .find(b => b.textContent?.trim().toLowerCase() === lbl);
              if (b) { b.click(); return true; }
              return false;
            }, label).catch(() => false);
          }

          async function clickBtnLike(page, re) {
            return page.evaluate(src => {
              const rx = new RegExp(src, 'i');
              const b = [...document.querySelectorAll('button,[role="button"]')].find(el => {
                const t = (el.textContent || '').trim().toLowerCase();
                const r = el.getBoundingClientRect();
                return r.width > 0 && !el.disabled && rx.test(t);
              });
              if (!b) return false;
              b.click();
              return true;
            }, re.source).catch(() => false);
          }

          async function safeType(page, selector, text, label) {
            if (!text) { console.log(label + ': 值为空，跳过'); return false; }
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const loc = page.locator(selector).first();
                await loc.waitFor({ state: 'visible', timeout: 15000 });
                await loc.click({ timeout: 5000 });
                await loc.fill('');
                await loc.pressSequentially(text, { delay: 35 });
                const val = await loc.inputValue();
                if (val === text) {
                  console.log(label + ': OK len=' + val.length);
                  return true;
                }
              } catch (e) {
                console.log(label + ' attempt ' + attempt + ' err: ' + e.message);
              }
              await sleep(500);
            }
            console.log(label + ': 3次尝试均失败');
            return false;
          }

          async function hasTurnstileToken(page) {
            return page.evaluate(() => {
              const els = document.querySelectorAll('input[name="cf-turnstile-response"], textarea[name="cf-turnstile-response"]');
              for (const el of els) if (el.value && el.value.length > 10) return true;
              return false;
            }).catch(() => false);
          }

          async function getChallengeState(page) {
            return page.evaluate(() => {
              const readyState = document.readyState;
              const title = (document.title || '').trim();
              const text = (document.body?.innerText || '').trim();
              const isBlankLoading = readyState !== 'complete' || text.length < 30;
              const isInterstitial =
                isBlankLoading ||
                /just a moment|attention required|请稍候/i.test(title) ||
                /performing security verification|verifying you are human|checking your browser before accessing/i.test(text) ||
                !!document.querySelector('#challenge-running, #challenge-stage');
              const isSpinningOnly = /verifying you are human\. this may take a few seconds/i.test(text);
              let verifyBtnPos = null;
              const candidates = [...document.querySelectorAll('button, input[type="button"], input[type="submit"], [role="button"], a')];
              for (const el of candidates) {
                const label = (el.innerText || el.textContent || el.value || '').trim();
                if (/verify you are human|确认您是真人/i.test(label)) {
                  const r = el.getBoundingClientRect();
                  if (r.width > 0 && r.height > 0) {
                    verifyBtnPos = { x: r.x + r.width / 2, y: r.y + r.height / 2, label };
                    break;
                  }
                }
              }
              return { isInterstitial, isBlankLoading, isSpinningOnly, verifyBtnPos, readyState, title, snippet: text.replace(/\s+/g, ' ').slice(0, 90) };
            }).catch(() => ({ isInterstitial: true, isBlankLoading: true, isSpinningOnly: false, verifyBtnPos: null, readyState: 'loading', title: '', snippet: '' }));
          }

          async function clickTurnstileBox(page, knownBtnPos = null) {
            try {
              if (knownBtnPos) {
                console.log(`[turnstile] clicking verify button "${knownBtnPos.label}" at (${Math.round(knownBtnPos.x)}, ${Math.round(knownBtnPos.y)})`);
                await humanClick(page, knownBtnPos.x, knownBtnPos.y);
                return true;
              }
              for (const f of page.frames()) {
                if (f.url().includes('challenges.cloudflare.com')) {
                  const frameEl = await f.frameElement().catch(() => null);
                  if (frameEl) {
                    const box = await frameEl.boundingBox().catch(() => null);
                    if (box && box.width > 0 && box.height > 0) {
                      const cx = box.x + Math.min(28, box.width * 0.15);
                      const cy = box.y + box.height / 2;
                      console.log(`[turnstile] clicking iframe at (${Math.round(cx)}, ${Math.round(cy)})`);
                      await humanClick(page, cx, cy);
                      return true;
                    }
                  }
                }
              }
              const pos = await page.evaluate(() => {
                const el = document.querySelector('.cf-turnstile, [data-sitekey], iframe[src*="challenges.cloudflare.com"]');
                if (!el) return null;
                el.scrollIntoView({ block: 'center' });
                const r = el.getBoundingClientRect();
                if (r.width > 0 && r.height > 0) return { x: r.x + Math.min(28, r.width * 0.15), y: r.y + r.height / 2 };
                return null;
              }).catch(() => null);
              if (pos) {
                console.log(`[turnstile] fallback click at (${Math.round(pos.x)}, ${Math.round(pos.y)})`);
                await humanClick(page, pos.x, pos.y);
                return true;
              }
            } catch (e) {
              console.log('[turnstile] click err: ' + e.message);
            }
            return false;
          }

          async function waitForCloudflare(page, timeoutMs) {
            timeoutMs = timeoutMs || 120000;
            const start = Date.now();
            let end = start + timeoutMs;
            let lastLog = 0;
            let lastBtnClick = 0;
            let lastIframeClick = 0;

            while (Date.now() < end) {
              const st = await getChallengeState(page);
              if (!st.isInterstitial) {
                await sleep(2000);
                const st2 = await getChallengeState(page);
                if (!st2.isInterstitial) {
                  if (Date.now() - start > 3000) {
                    console.log('[cf] challenge passed -> ' + page.url());
                  }
                  return true;
                }
              }
              const elapsed = Math.round((Date.now() - start) / 1000);
              if (Date.now() - lastLog > 6000) {
                lastLog = Date.now();
                console.log(`[cf] waiting (${elapsed}s): ${st.snippet || st.readyState}`);
              }
              if (st.verifyBtnPos && Date.now() - lastBtnClick > 18000) {
                lastBtnClick = Date.now();
                await clickTurnstileBox(page, st.verifyBtnPos);
                end = Math.max(end, Date.now() + 35000);
              } else if (!st.isBlankLoading && !st.isSpinningOnly && elapsed >= 8 && Date.now() - lastIframeClick > 25000) {
                lastIframeClick = Date.now();
                await clickTurnstileBox(page, null);
              }
              await sleep(1500);
            }
            console.log('[cf] interstitial timeout');
            return false;
          }

          async function solveTurnstile(page, timeoutMs) {
            timeoutMs = timeoutMs || 60000;
            const cfOk = await waitForCloudflare(page, timeoutMs);
            if (!cfOk) return false;
            const start = Date.now();
            const end = start + timeoutMs;
            let clickCount = 0;
            console.log('[turnstile] checking widget token...');
            while (Date.now() < end) {
              const st = await getChallengeState(page);
              if (st.isInterstitial) {
                await sleep(1000);
                continue;
              }
              const hasWidget = await page.evaluate(() => !!document.querySelector('input[name="cf-turnstile-response"], textarea[name="cf-turnstile-response"], .cf-turnstile, iframe[src*="challenges.cloudflare.com"]')).catch(() => false);
              if (!hasWidget) {
                console.log('[turnstile] no widget on page, ready');
                return true;
              }
              if (await hasTurnstileToken(page)) {
                const token = await page.evaluate(() => {
                  const el = document.querySelector('input[name="cf-turnstile-response"], textarea[name="cf-turnstile-response"]');
                  return el && el.value ? el.value : null;
                });
                console.log('[turnstile] solved, token len=' + (token ? token.length : 0));
                return true;
              }
              const elapsed = Date.now() - start;
              if ((clickCount === 0 && elapsed > 6000) || (clickCount === 1 && elapsed > 26000)) {
                clickCount++;
                await clickTurnstileBox(page, st.verifyBtnPos);
              }
              await sleep(1000);
            }
            console.log('[turnstile] unconfirmed (timeout)');
            return false;
          }

          async function getStatus(page) {
            return page.evaluate(() => {
              function w(root) {
                const it = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
                let n;
                while ((n = it.nextNode())) {
                  const t = n.textContent.trim().toLowerCase();
                  if (t==='offline'||t==='离线'||t==='已停止') return 'offline';
                  if (t==='starting'||t==='启动中'||t==='正在启动') return 'starting';
                  if (t==='online'||t==='running'||t==='在线'||t==='运行中') return 'online';
                }
                return null;
              }
              for (const s of ['.server-status','[class*="status"]','[class*="badge"]','.badge'])
                for (const el of document.querySelectorAll(s)) { const r=w(el); if(r) return r; }
              return w(document.body) || 'unknown';
            });
          }

          async function getRemainingTime(page) {
            const r = await page.evaluate(() => {
              const norm = s => ((s || '').replace(/\u00a0/g, ' ')).trim();
              function parseTimerText(t) {
                t = norm(t);
                if (!t) return -1;
                const hms = t.match(/(\d{1,4}):([0-5]\d):([0-5]\d)/);
                if (hms) return (+hms[1]) * 3600 + (+hms[2]) * 60 + (+hms[3]);
                let h = 0, m = 0, s = 0, hit = false, mm;
                if ((mm = t.match(/(\d{1,4})\s*(?:hours?|hrs?|h|小时|时)(?![a-zA-Z])/i))) { h = +mm[1]; hit = true; }
                if ((mm = t.match(/(\d{1,4})\s*(?:minutes?|mins?|分钟|分)(?![a-zA-Z])/i)) ||
                    (mm = t.match(/(\d{1,4})\s*m(?![a-zA-Z])/))) { m = +mm[1]; hit = true; }
                if ((mm = t.match(/(\d{1,4})\s*(?:seconds?|secs?|秒)(?![a-zA-Z])/i)) ||
                    (mm = t.match(/(\d{1,4})\s*s(?![a-zA-Z])/))) { s = +mm[1]; hit = true; }
                if (hit) return h * 3600 + m * 60 + s;
                return -1;
              }
              const KW = ['remain', 'left', 'expire', 'countdown', 'timer', '计时器', '续订', '剩余', '倒计时', '续期', '到期'];
              const els = document.querySelectorAll('body *');
              for (const el of els) {
                if (el.children.length > 0) continue;
                const t = norm(el.innerText || el.textContent);
                if (!t || t.length > 80) continue;
                const low = t.toLowerCase();
                if (!KW.some(k => low.includes(k))) continue;
                let node = el;
                for (let lvl = 0; lvl <= 2; lvl++) {
                  const pt = norm(node.innerText || node.textContent);
                  if (pt && pt.length <= 300) {
                    const v = parseTimerText(pt);
                    if (v >= 0) return { v, how: 'keyword-lvl' + lvl, sample: pt.substring(0, 80) };
                  }
                  if (!node.parentElement) break;
                  node = node.parentElement;
                }
              }
              for (const el of document.querySelectorAll('body *')) {
                if (el.children.length > 0) continue;
                const t = norm(el.innerText || el.textContent);
                if (!t || t.length > 80) continue;
                if (!/(小时|时|hours?|hrs?)/i.test(t)) continue;
                if (!/(分钟|分|minutes?|mins?)/i.test(t)) continue;
                if (!/(秒|seconds?|secs?)/i.test(t)) continue;
                const v = parseTimerText(t);
                if (v >= 0) return { v, how: 'leaf-hms', sample: t.substring(0, 80) };
              }
              const body = norm(document.body.innerText);
              const all = body.match(/\d{1,4}:[0-5]\d:[0-5]\d/g) || [];
              if (all.length > 0) {
                const p = all[0].split(':');
                return { v: (+p[0]) * 3600 + (+p[1]) * 60 + (+p[2]), how: 'fallback-first-hms', sample: all[0] };
              }
              return { v: -1, how: 'none', sample: body.substring(0, 80) };
            }).catch(() => ({ v: -1, how: 'evaluate-err', sample: '' }));
            console.log('parse time: v=' + r.v + ' via=' + r.how + ' sample=' + (r.sample || '').substring(0, 60));
            return r.v;
          }

          async function dumpUi(page, tag) {
            const info = await page.evaluate(() => {
              const vis = el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
              const btns = [...document.querySelectorAll('button,[role="button"],a')].filter(vis).map(el => ({
                t: (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 50),
                href: el.getAttribute('href') || '',
                cls: String(el.className || '').slice(0, 40),
                aria: el.getAttribute('aria-label') || '',
                title: el.getAttribute('title') || '',
                dis: !!el.disabled
              })).filter(x => x.t || x.href);
              const dlg = [...document.querySelectorAll('[role="dialog"],[class*="modal"],[class*="Modal"],[class*="dialog"],[class*="Dialog"]')].filter(vis).map(el => (el.innerText || '').replace(/\s+/g, ' ').slice(0, 300));
              const ifr = [...document.querySelectorAll('iframe')].map(f => (f.src || '').slice(0, 100));
              const text = (document.body.innerText || '').replace(/\s+/g, ' ').slice(0, 1500);
              const nums = [...document.querySelectorAll('body *')].filter(el => !el.children.length).map(el => (el.textContent || '').trim()).filter(t => t && t.length < 40 && /[0-9]/.test(t) && /(小时|时|分|秒|hour|min|sec|day|天)/i.test(t));
              return { url: location.href, btns: btns.slice(0, 60), dlg, ifr, nums: [...new Set(nums)].slice(0, 30), text };
            }).catch(e => ({ err: e.message }));
            console.log('UI[' + tag + '] ' + JSON.stringify(info));
          }

          async function tryAdRound(page, label) {
