              if (!cfOk) {
                throw new Error('ProtocolError: Cloudflare challenge timeout on console');
              }
              const url = page.url();
              if (url.includes('/server/') && !url.includes('/auth/login')) {
                console.log('cookie 有效，直接进入控制台');
                loggedIn = true;
                await saveCookies(context);
              } else {
                console.log('缓存 cookie 已过期，尝试回退到 FALIX_COOKIES Secret...');
                const secretLoaded = await loadCookies(context, true);
                if (secretLoaded) {
                  await page.goto(SERVER_URL, { waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => {});
                  await sleep(2000);
                  const cfOk2 = await waitForCloudflare(page, 120000);
                  if (!cfOk2) throw new Error('ProtocolError: Cloudflare challenge timeout on secret cookie');
                  const url2 = page.url();
                  if (url2.includes('/server/') && !url2.includes('/auth/login')) {
                    console.log('FALIX_COOKIES Secret 有效，直接进入控制台');
                    loggedIn = true;
                    await saveCookies(context);
                  } else {
                    console.log('Secret cookie 也已过期，需要重新登录');
                  }
                }
              }
            }

            if (!loggedIn) {
              await page.goto(LOGIN_URL, { waitUntil: 'domcontentloaded', timeout: 30000 });
              const cfLoginOk = await waitForCloudflare(page, 120000);
              if (!cfLoginOk) throw new Error('ProtocolError: Cloudflare challenge timeout on login');
              await sleep(1000);
              await shot(page, '01_login');

              const emailOk = await safeType(page, 'input[name="email"], input#email, input[name="email-address"], input[type="email"], input[id="email-address"]', EMAIL, 'email');
              const passOk = await safeType(page, 'input[name="password"], input#password, input[type="password"], input[id="password"]', PASSWORD, 'password');
              await sleep(500);
              await shot(page, '02_creds');
              if (!emailOk || !passOk) throw new Error('登录表单填写失败: email=' + emailOk + ' password=' + passOk);

              const tOk = await solveTurnstile(page, 60000);
              console.log(tOk ? 'login turnstile ok' : 'login turnstile unconfirmed');
              await shot(page, '03_turnstile');

              const lp = await clickBtn(page, 'sign in') || await clickBtn(page, '登录');
              if (!lp) await page.keyboard.press('Enter');

              try { await page.waitForNavigation({ timeout: 20000, waitUntil: 'domcontentloaded' }); } catch { await sleep(5000); }
              await waitForCloudflare(page, 90000);
              await shot(page, '04_after_login');

              if (page.url().includes('/auth/2fa')) {
                console.log('login requires 2FA: ' + page.url());
                await tg('❌ <b>Falix</b> 登录需要 2FA，脚本无法自动完成');
                throw new Error('账号启用了 2FA（' + page.url() + '），请关闭 2FA 或改用 cookie');
              }

              if (page.url().includes('/auth/login')) {
                const err = await page.evaluate(() => [...document.querySelectorAll('.invalid-feedback,.alert,.error,[role="alert"]')].map(e => e.textContent?.trim()).filter(Boolean).join('|')).catch(() => '');
                console.log('login failed: ' + err);
                await tg('❌ <b>Falix</b> 登录失败: ' + err);
                process.exit(1);
              }
              console.log('login ok');
              await saveCookies(context);
              try { fs.writeFileSync('fresh-login.flag', String(Date.now())); } catch {}
              await checkTime('login');
            }

            if (!page.url().includes(`/server/${SERVER_ID}/console`)) {
              await page.goto(SERVER_URL, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await sleep(2000);
              const cfConsoleOk = await waitForCloudflare(page, 120000);
              if (!cfConsoleOk) throw new Error('ProtocolError: Cloudflare challenge timeout before console');
            }
            await shot(page, '05_console');
            await dumpUi(page, 'console');

            const st = await getStatus(page);
            console.log('status: ' + st);
            await checkTime('status');

            if (st === 'starting' || st === 'online') {
              await tg('✅ <b>Falix</b> 状态 <code>' + st + '</code>，无需操作');
              console.log('already running');
            } else {
              const final = await doStart(page);
              if (final === 'starting' || final === 'online') {
                await tg('✅ <b>Falix</b> 启动成功，状态: <code>' + final + '</code>');
                console.log('start success');
              } else {
                await tg('⚠️ <b>Falix</b> 三次后仍为 <code>' + final + '</code>');
                console.log('still: ' + final);
              }
            }

            await page.goto(TIMER_URL, { waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => {});
            await sleep(2000);
            const cfTimerOk = await waitForCloudflare(page, 120000);
            if (!cfTimerOk) throw new Error('ProtocolError: Cloudflare challenge timeout on timer');
            const timeBefore = await getRemainingTime(page);
            console.log('time before extend: ' + timeBefore + 's');

            const ext = await doExtend(page);
            await checkTime('extend');

            await page.goto(TIMER_URL, { timeout: 15000 }).catch(() => {});
            await sleep(2000);
            await waitForCloudflare(page, 90000);
            const timeAfter = await getRemainingTime(page);
            console.log('time after extend: ' + timeAfter + 's (ext=' + ext + ')');
            const fmt = s => Math.floor(s/3600) + 'h' + Math.floor(s%3600/60) + 'm';
            const CAP = 168 * 3600;
            if (timeAfter > timeBefore && timeBefore > 0 && timeAfter > 0) {
              const gain = timeAfter - timeBefore;
              await tg('✅ <b>Falix</b> 计时器已续期: ' + fmt(timeBefore) + '(' + timeBefore + 's) → ' + fmt(timeAfter) + '(' + timeAfter + 's) +' + gain + 's');
              console.log('timer extend success (verified gain=' + gain + ')');
            } else if (ext === 'capped' || timeAfter >= CAP - 3600) {
              await tg('✅ <b>Falix</b> 计时器接近上限: ' + fmt(timeAfter) + '，无需续期');
              console.log('timer already near cap (' + timeAfter + 's)');
            } else if (timeAfter > 0 && timeBefore === -1) {
              await tg('✅ <b>Falix</b> 计时器读数: ' + fmt(timeAfter) + '（续期状态: ' + ext + '）');
              console.log('timer extend result (timeBefore unknown)');
            } else if (ext === 'ok') {
              await tg('✅ <b>Falix</b> 计时器已续期（时间校验: ' + timeBefore + '→' + timeAfter + '）');
              console.log('timer extend success (unverified)');
            } else if (timeAfter === timeBefore && timeAfter > 0) {
              await tg('⚠️ <b>Falix</b> 计时器时间未增加: ' + timeBefore + 's → ' + timeAfter + 's (ext=' + ext + ')');
              console.log('timer extend failed (time unchanged, ext=' + ext + ')');
            } else {
              await tg('⚠️ <b>Falix</b> 计时器续期失败: <code>' + ext + '</code>（' + timeBefore + '→' + timeAfter + '）');
              console.log('timer extend failed: ' + ext);
            }
          } catch (e) {
            const msg = (e && e.message) ? e.message : String(e);
            console.error('error: ' + msg);
            await shot(page, 'error').catch(() => {});
            await tg('❌ <b>Falix</b> 出错: ' + msg);
            const retryable = /ProtocolError|timed out|Target closed|Connection closed|Session closed/i.test(msg);
            process.exit(retryable ? 2 : 1);
          } finally {
            await context.close().catch(() => {});
          }
          """
          import os
          cwd = os.environ.get('GITHUB_WORKSPACE', os.getcwd())
          path = os.path.join(cwd, 'run.mjs')
          with open(path, 'w') as f:
              f.write(script.strip())
          print('written to: ' + path)
          PYEOF

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FALIX_EMAIL: ${{ secrets.FALIX_EMAIL }}
          FALIX_PASSWORD: ${{ secrets.FALIX_PASSWORD }}
          FALIX_SERVER_ID: ${{ secrets.FALIX_SERVER_ID }}
          FALIX_COOKIES: ${{ secrets.FALIX_COOKIES }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COOKIES_PATH: ${{ github.workspace }}/cookies.json
        run: |
          attempt=1
          while true; do
            code=0
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node run.mjs || code=$?
            if [ "$code" -eq 0 ]; then
              break
            fi
            if [ "$code" -eq 2 ] && [ "$attempt" -lt 2 ]; then
              attempt=$((attempt + 1))
              echo "CDP 故障（exit 2），5s 后第 ${attempt}/2 次重试..."
              sleep 5
              continue
            fi
            exit "$code"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: /tmp/ss/
          retention-days: 3

      - name: Save cookies
        if: always() && hashFiles('cookies.json') != ''
        uses: actions/cache/save@v5
        with:
          path: cookies.json
          key: falix-cookies-${{ github.run_id }}

      - name: Cleanup old runs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ github.run_id }}"
          ids=$(gh api "repos/${{ github.repository }}/actions/workflows/falix-auto-start.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' | grep -v "^${current}$" || true)
          keep=$(echo "$ids" | sort -nr | head -n 3)
          for id in $ids; do
            if [ -n "$id" ] && ! echo "$keep" | grep -qx "$id"; then
              echo "deleting run $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
            fi
          done
