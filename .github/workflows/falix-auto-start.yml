            while (Date.now() < adDeadline) {
              await sleep(2000);
              try {
                const state = await page.evaluate(() => {
                  const v = document.querySelector('video');
                  if (!v) return null;
                  return { paused: v.paused, ct: v.currentTime|0, dur: v.duration|0, ended: v.ended, rs: v.readyState, hasSrc: !!(v.currentSrc || v.src) };
                }).catch(() => null);
                if (state) {
                  if (state.hasSrc && !sawSrc) { sawSrc = true; console.log(label + ': video src loaded'); }
                  if (!state.paused && state.ct > 0) {
                    console.log(label + ' ad playing: ' + state.ct + '/' + state.dur + 's');
                  }
                  if (state.paused && state.hasSrc && Date.now() - lastPlayAt > 5000) {
                    lastPlayAt = Date.now();
                    await page.evaluate(() => { const v = document.querySelector('video'); if (v) v.play().catch(() => {}); }).catch(() => {});
                    console.log(label + ': re-play called');
                  }
                  if (state.ended || (state.ct >= state.dur && state.dur > 0)) {
                    console.log(label + ': ad video ended');
                    await sleep(3000);
                    break;
                  }
                }
                const txt = await page.evaluate(() => document.body.innerText.substring(0, 500)).catch(() => '');
                if (txt.includes('Timer has been extended') || txt.includes('extended') || txt.includes('计时器已')) {
                  console.log(label + ': timer extended during ad wait');
                  alreadyExt = true;
                  break;
                }
                const cur = page.url();
                if (!urlBeforeAd.includes('timer?id=') && cur.includes('timer?id=')) {
                  console.log(label + ': back on timer page');
                  break;
                }
              } catch {}
            }
            if (!sawSrc) console.log(label + ': video never got a src');
            try { await page.bringToFront(); } catch {}

            if (alreadyExt) {
              await shot(page, label + '_result').catch(() => {});
              return 'ok';
            }
            return 'unconfirmed';
          }

          async function doExtend(page) {
            console.log('=== TIMER EXTEND ===');
            const CAP = 168 * 3600;
            let lastKnown = -1;
            let totalGain = 0;

            for (let attempt = 1; attempt <= 3; attempt++) {
              await page.goto(TIMER_URL, { waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => {});
              await sleep(2000);
              const cfOk = await waitForCloudflare(page, 120000);
              if (!cfOk) throw new Error('ProtocolError: Cloudflare challenge blocked timer page');

              await page.evaluate(() => {
                const btns = [...document.querySelectorAll('button')];
                const accept = btns.find(b => b.textContent.includes('Accept all') || b.textContent.includes('接受全部') || b.textContent.includes('接受所有'));
                if (accept) { accept.click(); console.log('gdpr accepted'); }
              }).catch(() => {});
              await sleep(1000);
              if (attempt === 1) await shot(page, 'timer_01_loaded').catch(() => {});

              await solveTurnstile(page, 45000);
              await sleep(1000);
              if (attempt === 1) await shot(page, 'timer_02_turnstile').catch(() => {});

              const before = await getRemainingTime(page);
              if (before >= 0) lastKnown = before;
              console.log('timer before click (attempt ' + attempt + '): ' + before + 's');

              const tp = await clickBtn(page, 'add time') || await clickBtn(page, '添加时间');
              if (!tp) {
                console.log('no extend button found (attempt ' + attempt + ')');
                await shot(page, 'timer_03_no_btn_' + attempt).catch(() => {});
                if (attempt < 3) continue;
                return 'no_btn';
              }
              console.log('click add time ok (attempt ' + attempt + ')');
              await sleep(3000);
              await shot(page, 'timer_add_' + attempt).catch(() => {});

              const hasAd = await page.evaluate(() => [...document.querySelectorAll('button')].some(b => {
                const t = (b.textContent || '').trim().toLowerCase();
                return t === 'watch ad' || t === '观看广告';
              })).catch(() => false);
              if (hasAd) {
                const r = await tryAdRound(page, 'ad' + attempt);
                if (r === 'ok') return 'ok';
              }

              await page.goto(TIMER_URL, { waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => {});
              await sleep(2000);
              await waitForCloudflare(page, 90000);
              await solveTurnstile(page, 30000);
              await sleep(1000);
              const after = await getRemainingTime(page);
              console.log('timer after click (attempt ' + attempt + '): ' + after + 's');
              await shot(page, 'timer_after_' + attempt).catch(() => {});

              if (before >= 0 && after > before) {
                totalGain += after - before;
                console.log('timer extend success (gain=' + (after - before) + 's, total=' + totalGain + 's)');
              }
              if (after >= CAP - 3600) {
                console.log('timer near cap (~' + Math.floor(after/3600) + 'h), stop');
                return totalGain > 0 ? 'ok' : 'capped';
              }
              if (after >= 0) lastKnown = after;
              if (after <= before && totalGain > 0) {
                console.log('timer not increased on attempt ' + attempt + ', stop (limit/cooldown)');
                break;
              }
              console.log('timer not increased on attempt ' + attempt + ', retrying...');
            }

            if (totalGain > 0) return 'ok';
            await dumpUi(page, 'extend_unconfirmed');
            console.log('extend unconfirmed (lastKnown=' + lastKnown + 's)');
            return 'unconfirmed';
          }

