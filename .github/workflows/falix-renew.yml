name: Falix Renew Pro

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: falix-renew
  cancel-in-progress: false

jobs:
  renew:
    name: Falix Auto Renew
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import importlib.metadata
          print(importlib.metadata.version("playwright"))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $VERSION"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium
          # CloakBrowser 需要单独 ensure_binary (会自动下载 stealth Chromium)
          python -c "from cloakbrowser import ensure_binary; ensure_binary()" || echo "cloakbrowser ensure_binary failed (may use system Chromium)"

      - name: "🌐 启动代理 (sing-box, 多格式: hysteria2/hy2/tuic/vless/vmess)"
        env:
          PROXY_URI: ${{ secrets.PROXY_URI }}
        shell: bash
        run: |
          set -e

          # PROXY_URI 是可选的; 不配代理则直连 (GitHub IP 可能被 CF 风控,
          # managed challenge 大概率无法自动通过, 但仍可尝试)
          if [ -z "$PROXY_URI" ]; then
            echo "⚠️  PROXY_URI 未配置, 直连模式 (CF managed challenge 可能无法通过)"
            echo "建议: 配 PROXY_URI secret (住宅代理最佳), 格式与 zampto 项目一致:"
            echo "  hysteria2://password@host:port?sni=...&insecure=1"
            echo "  hy2://password@host:port?..."
            echo "  tuic://uuid:password@host:port?..."
            echo "  vless://uuid@host:port?..."
            echo "  vmess://base64..."
            exit 0
          fi

          echo "[1/4] 解析节点链接并生成 sing-box 配置 ..."
          python3 << 'PYEOF'
          import urllib.parse, json, os, sys, base64

          link = os.environ.get("PROXY_URI", "").strip()
          if not link:
              sys.exit(1)

          proto = "hysteria2"
          for prefix in ["hysteria2://", "hy2://", "tuic://", "vless://", "vmess://"]:
              if link.startswith(prefix):
                  link = link[len(prefix):]
                  proto = {"tuic://": "tuic", "vless://": "vless", "vmess://": "vmess"}.get(prefix, "hysteria2")
                  break
          link = link.split("#", 1)[0]
          if "?" in link:
              main, query = link.split("?", 1)
          else:
              main, query = link, ""
          params = urllib.parse.parse_qs(query)
          sni = params.get("sni", [""])[0]
          insecure = any(params.get(k, ["0"])[0] in ("1", "true", "yes")
                         for k in ("insecure", "allowInsecure", "allow_insecure"))
          alpn = params.get("alpn", [""])[0]

          out = {"type": proto, "tag": "proxy-out"}
          if proto == "vmess":
              b64 = main + "=" * ((4 - len(main) % 4) % 4)
              vm = json.loads(base64.b64decode(b64).decode("utf-8", "ignore"))
              out["server"] = vm.get("add", "")
              out["server_port"] = int(vm.get("port", 0))
              out["uuid"] = vm.get("id", "")
              out["alter_id"] = int(vm.get("aid", "0"))
              out["security"] = vm.get("scy", "auto") or "auto"
              out["tls"] = {"enabled": False, "server_name": sni or vm.get("host", ""), "insecure": insecure}
              if vm.get("tls") == "tls" or vm.get("sni") or vm.get("host"):
                  out["tls"]["enabled"] = True
                  out["tls"]["server_name"] = sni or vm.get("sni") or vm.get("host") or out["server"]
          else:
              password_raw, server_part = main.rsplit("@", 1)
              password = urllib.parse.unquote(password_raw)
              server, port_str = server_part.rsplit(":", 1)
              out["server"] = server
              out["server_port"] = int(port_str)
              if proto == "tuic" or proto == "vless":
                  if ":" in password:
                      out["uuid"], out["password"] = password.split(":", 1)
                  else:
                      out["uuid"] = password
              else:
                  out["password"] = password
              out["tls"] = {"enabled": True, "server_name": sni or server, "insecure": insecure}
              if alpn:
                  out["tls"]["alpn"] = [alpn]
              if proto == "tuic":
                  out["udp_relay_mode"] = "native"
                  out["congestion_control"] = "bbr"
              elif proto == "hysteria2":
                  out["up_mbps"] = 100
                  out["down_mbps"] = 100

          cfg = {
              "log": {"level": "info", "timestamp": True},
              "inbounds": [{"type": "socks", "tag": "socks-in",
                            "listen": "127.0.0.1", "listen_port": 1080}],
              "outbounds": [out],
          }
          with open("/tmp/sb_config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
          print("Protocol:", proto)
          print("Server:", out.get("server", "?"), ":", out.get("server_port", "?"))
          print("SNI:", out.get("tls", {}).get("server_name", ""))
          print("Insecure:", insecure)
          PYEOF
          echo "--- 生成的配置 ---"
          cat /tmp/sb_config.json

          echo "[2/4] Downloading sing-box ..."
          SB_VERSION="1.10.7"
          SB_URL="https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          curl -fSL "$SB_URL" -o /tmp/sb.tar.gz
          tar -xzf /tmp/sb.tar.gz -C /tmp/
          mv /tmp/sing-box-${SB_VERSION}-linux-amd64/sing-box /tmp/sing-box
          chmod +x /tmp/sing-box

          # Validate config before running
          echo "--- Validating config ---"
          /tmp/sing-box check -c /tmp/sb_config.json || { echo "[ERROR] sing-box config validation failed"; cat /tmp/sb_config.json; exit 1; }

          echo "[3/4] Starting sing-box ..."
          nohup /tmp/sing-box run -c /tmp/sb_config.json > /tmp/sb.log 2>&1 &
          SB_PID=$!
          echo "SB_PID=$SB_PID"
          sleep 8

          echo "--- sing-box log ---"
          cat /tmp/sb.log || true
          echo "--------------------"

          echo "Direct IP: $(curl -s --max-time 5 ifconfig.me || echo 'fail')"
          echo "Proxy IP:  $(curl -s --max-time 15 --socks5 127.0.0.1:1080 ifconfig.me || echo 'proxy fail')"

          # 代理必须可用, 否则后续 CF 必拒
          if curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://www.google.com -o /dev/null; then
            echo "ALL_PROXY=socks5h://127.0.0.1:1080" >> $GITHUB_ENV
            echo "HTTP_PROXY=socks5h://127.0.0.1:1080" >> $GITHUB_ENV
            echo "HTTPS_PROXY=socks5h://127.0.0.1:1080" >> $GITHUB_ENV
            echo "[OK] Proxy is ready"
          else
            echo "[ERROR] Proxy is DOWN"
            echo "---- sing-box log ----"
            cat /tmp/sb.log 2>/dev/null | tail -30 || echo "no log"
            echo "----------------------"
            exit 1
          fi

      - name: Validate required secrets
        env:
          FALIX_SERVER_IDS: ${{ secrets.FALIX_SERVER_IDS }}
          FALIX_STORAGE_STATE: ${{ secrets.FALIX_STORAGE_STATE }}
        shell: bash
        run: |
          set -e

          if [ -z "$FALIX_SERVER_IDS" ]; then
            echo "::error::FALIX_SERVER_IDS is missing"
            exit 1
          fi

          if [ -z "$FALIX_STORAGE_STATE" ]; then
            echo "::error::FALIX_STORAGE_STATE is missing"
            exit 1
          fi

          echo "FALIX_SERVER_IDS: configured"
          echo "FALIX_STORAGE_STATE: configured"

      - name: Restore Falix storage state
        env:
          FALIX_STORAGE_STATE: ${{ secrets.FALIX_STORAGE_STATE }}
        shell: bash
        run: |
          set -e

          rm -f falix_state.json

          # 兼容两种 secret 内容:
          # 1) base64 编码的 storage_state JSON (zampto 项目同款格式)
          # 2) 直接的 storage_state JSON 明文 (Cookie Manager Pro 直接复制)
          # 先尝试 base64 --decode; 若失败 (invalid input), 假定是明文 JSON.
          if printf '%s' "$FALIX_STORAGE_STATE" | base64 --decode > falix_state.json 2>/dev/null; then
            # 解码成功, 校验是否合法 JSON
            if python3 -c "import json,sys; json.load(open('falix_state.json'))" 2>/dev/null; then
              echo "storage_state restored (base64-decoded)"
            else
              echo "::error::base64 decoded but not valid JSON"
              exit 1
            fi
          else
            # base64 解码失败, 假定 secret 是明文 JSON, 直接写入
            printf '%s' "$FALIX_STORAGE_STATE" > falix_state.json
            if python3 -c "import json,sys; json.load(open('falix_state.json'))" 2>/dev/null; then
              echo "storage_state restored (plain JSON)"
            else
              echo "::error::neither base64 nor valid JSON"
              exit 1
            fi
          fi

          if [ ! -s falix_state.json ]; then
            echo "::error::falix_state.json is empty"
            exit 1
          fi

          echo "storage_state ready"

      - name: Validate storage state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("falix_state.json")

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"::error::Invalid storage_state JSON: {exc}")
              raise SystemExit(1)

          # 兼容两种格式:
          # 1) Playwright storage_state: {"cookies": [...], "origins": [...]}
          # 2) Cookie Manager Pro 导出的裸数组: [{...}, {...}]
          # 如果是裸数组, 自动包装成 Playwright 格式
          if isinstance(data, list):
              print(f"Detected raw cookie array ({len(data)} cookies), wrapping into Playwright storage_state format")
              data = {"cookies": data, "origins": []}

          if not isinstance(data, dict):
              print("::error::storage_state must be a JSON object or array")
              raise SystemExit(1)

          # Cookie 字段转换: Cookie Manager Pro 格式 -> Playwright 格式
          # Cookie Manager Pro: name, value, domain, path, expirationDate, hostOnly,
          #                     httpOnly, secure, session, storeId, sameSite
          # Playwright:         name, value, domain, path, expires, httpOnly,
          #                     secure, sameSite
          SAMESITE_MAP = {
              "unspecified": "None",   # Playwright 不接受 unspecified, 用 None 兜底
              "no_restriction": "None",
              "lax": "Lax",
              "strict": "Strict",
              "none": "None",
          }
          converted = 0
          for c in data.get("cookies", []):
              # expirationDate -> expires (int, -1 表示 session cookie)
              if "expirationDate" in c and "expires" not in c:
                  ed = c.pop("expirationDate")
                  try:
                      c["expires"] = int(ed) if ed else -1
                  except (TypeError, ValueError):
                      c["expires"] = -1
                  converted += 1
              # 移除 Playwright 不识别的字段 (保留也无害, 但干净点)
              for k in ("hostOnly", "storeId", "session"):
                  c.pop(k, None)
              # sameSite 大小写规范化
              ss = c.get("sameSite")
              if isinstance(ss, str):
                  c["sameSite"] = SAMESITE_MAP.get(ss.lower(), ss)
          if converted:
              print(f"Converted {converted} cookies from Cookie Manager Pro format")
              path.write_text(json.dumps(data, indent=2), encoding="utf-8")

          print("storage_state JSON: valid")

          if "cookies" in data:
              print(f"Cookies: {len(data['cookies'])}")

          if "origins" in data:
              print(f"Origins: {len(data['origins'])}")
          PY

      - name: Prepare debug directory
        run: |
          mkdir -p debug_output
          rm -f debug_output/* || true

      - name: Run Falix Renew
        id: renew
        env:
          FALIX_SERVER_IDS: ${{ secrets.FALIX_SERVER_IDS }}
          FALIX_STORAGE_STATE: falix_state.json
          RENEW_BELOW_MINUTES: "20"
          HEADLESS: "true"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "=========================================="
          echo "Falix Renew Pro"
          echo "=========================================="
          echo "Run number: ${{ github.run_number }}"
          echo "Renew threshold: ${RENEW_BELOW_MINUTES:-20} minutes"
          echo "Proxy: ${ALL_PROXY:-direct}"
          echo "Starting renew.py..."

          python renew.py
          PYTHON_EXIT=$?

          # CRITICAL: Clear proxy env vars so subsequent Node.js steps (upload-artifact)
          # don't try to use SOCKS5 which they don't support
          echo "ALL_PROXY=" >> $GITHUB_ENV
          echo "HTTP_PROXY=" >> $GITHUB_ENV
          echo "HTTPS_PROXY=" >> $GITHUB_ENV

          exit $PYTHON_EXIT

      - name: Generate job summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Falix Renew Pro"
            echo
            echo "## Run information"
            echo
            echo "- Run: #${{ github.run_number }}"
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "## Result"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **Renew job completed successfully**"
            else
              echo "❌ **Renew job failed**"
            fi
            echo
            echo "## Debug"
            echo
            if [ -d "debug_output" ]; then
              COUNT=$(find debug_output -type f | wc -l)
              echo "Debug files: $COUNT"
            else
              echo "debug_output directory not found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        env:
          # 显式清空代理环境变量给 upload-artifact@v4 用 (Node undici 解析代理 URL,
          # socks5h:// 它不支持会抛 "Invalid URL protocol" 错误).
          # GitHub Actions env key 不区分大小写, 不能同时写 ALL_PROXY 和 all_proxy,
          # 否则会被拒 "X is already defined". 这里只保留大写形式.
          ALL_PROXY: ''
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          NO_PROXY: '*'
        with:
          name: falix-debug-${{ github.run_number }}
          path: debug_output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove storage state
        if: always()
        shell: bash
        run: |
          rm -f falix_state.json
          echo "Sensitive storage state removed."
