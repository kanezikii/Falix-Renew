name: Falix Renew Pro

on:
  workflow_dispatch:

  schedule:
    # 每 6 小时检查一次
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Prepare storage state
        env:
          FALIX_STORAGE_STATE_B64: ${{ secrets.FALIX_STORAGE_STATE_B64 }}
        run: |
          if [ -n "$FALIX_STORAGE_STATE_B64" ]; then
            echo "$FALIX_STORAGE_STATE_B64" | base64 -d > falix_state.json
          fi

      - name: Run Falix Renew
        env:
          FALIX_SERVER_IDS: ${{ secrets.FALIX_SERVER_IDS }}
          FALIX_STORAGE_STATE: falix_state.json

          RENEW_BELOW_MINUTES: "20"
          HEADLESS: "true"

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python renew.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falix-debug
          path: debug_output/
          if-no-files-found: ignore
