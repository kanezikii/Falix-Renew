name: Falix Renew Pro

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: falix-renew
  cancel-in-progress: false

jobs:
  renew:
    name: Falix 自动续期
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📦 拉取仓库
        uses: actions/checkout@v4

      - name: 🐍 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🐍 获取 Playwright 版本
        id: playwright-version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import importlib.metadata
          print(importlib.metadata.version("playwright"))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Playwright 版本: $VERSION"

      - name: 💾 缓存 Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: 📦 安装 Playwright Chromium + CloakBrowser stealth Chromium
        run: |
          python -m playwright install --with-deps chromium
          python -c "from cloakbrowser import ensure_binary; ensure_binary()" || echo "cloakbrowser ensure_binary 降级"

      - name: "🌐 启动代理 (sing-box)"
        env:
          PROXY_URI: ${{ secrets.PROXY_URI }}
        shell: bash
        run: |
          set -e
          if [ -z "$PROXY_URI" ]; then
            echo "⚠️ PROXY_URI 未配置，直连运行"
            exit 0
          fi

          echo "[1/4] 解析节点链接并生成 sing-box 配置 ..."
          python3 << 'PYEOF'
          import urllib.parse, json, os, sys, base64

          link = os.environ.get("PROXY_URI", "").strip()
          if not link:
              sys.exit(1)

          proto = "hysteria2"
          for prefix in ["hysteria2://", "hy2://", "tuic://", "vless://", "vmess://"]:
              if link.startswith(prefix):
                  link = link[len(prefix):]
                  proto = {"tuic://": "tuic", "vless://": "vless", "vmess://": "vmess"}.get(prefix, "hysteria2")
                  break
          link = link.split("#", 1)[0]
          main, query = link.split("?", 1) if "?" in link else (link, "")
          params = urllib.parse.parse_qs(query)
          sni = params.get("sni", [""])[0]
          insecure = any(params.get(k, ["0"])[0] in ("1", "true", "yes") for k in ("insecure", "allowInsecure", "allow_insecure"))
          alpn = params.get("alpn", [""])[0]
          net_type = (params.get("type") or params.get("network") or [""])[0].lower()
          ws_path = params.get("path", [""])[0]
          ws_host = params.get("host", [""])[0]
          flow = params.get("flow", [""])[0]
          security = params.get("security", [""])[0].lower()
          pbk = params.get("pbk", [""])[0]
          sid = params.get("sid", [""])[0]
          fp = params.get("fp", [""])[0]
          svc_name = params.get("serviceName", [""])[0]

          def add_transport(o, default_ws_path="/"):
              if net_type in ("ws", "websocket"):
                  o["transport"] = {"type": "ws", "path": ws_path or default_ws_path, "headers": {"Host": ws_host} if ws_host else {}}
              elif net_type == "grpc":
                  o["transport"] = {"type": "grpc", "service_name": svc_name or ""}

          def add_tls(o, default_sni):
              sec = security or ("reality" if pbk else "tls")
              if sec == "none":
                  o["tls"] = {"enabled": False}
                  return
              tls = {"enabled": True, "server_name": sni or default_sni, "insecure": insecure}
              if alpn:
                  tls["alpn"] = [alpn]
              if sec == "reality":
                  tls["reality"] = {"enabled": True}
                  if pbk: tls["reality"]["public_key"] = pbk
                  if sid: tls["reality"]["short_id"] = sid
                  if fp: tls["fingerprint"] = fp
              o["tls"] = tls

          out = {"type": proto, "tag": "proxy-out"}
          if proto == "vmess":
              b64 = main + "=" * ((4 - len(main) % 4) % 4)
              vm = json.loads(base64.b64decode(b64).decode("utf-8", "ignore"))
              out["server"] = vm.get("add", "")
              out["server_port"] = int(vm.get("port", 0))
              out["uuid"] = vm.get("id", "")
              out["alter_id"] = int(vm.get("aid", "0"))
              out["security"] = vm.get("scy", "auto") or "auto"
              if vm.get("tls") == "tls" or vm.get("sni") or vm.get("host") or security == "tls":
                  add_tls(out, vm.get("sni") or vm.get("host") or out["server"])
              else:
                  out["tls"] = {"enabled": False, "insecure": insecure}
              v_net = (net_type or (vm.get("net") or "")).lower()
              if v_net in ("ws", "websocket"):
                  out["transport"] = {"type": "ws", "path": ws_path or vm.get("path", "/"), "headers": {"Host": ws_host or vm.get("host", "")}}
              elif v_net == "grpc":
                  out["transport"] = {"type": "grpc", "service_name": svc_name or vm.get("serviceName", "")}
              elif v_net not in ("", "tcp", "none"):
                  add_transport(out, vm.get("path", "/"))
          else:
              password_raw, server_part = main.rsplit("@", 1)
              password = urllib.parse.unquote(password_raw)
              server, port_str = server_part.rsplit(":", 1)
              out["server"] = server
              out["server_port"] = int(port_str)
              if proto in ("tuic", "vless"):
                  if ":" in password:
                      out["uuid"], out["password"] = password.split(":", 1)
                  else:
                      out["uuid"] = password
              else:
                  out["password"] = password
              add_tls(out, server)
              if flow and proto == "vless":
                  out["flow"] = flow
              if proto == "tuic":
                  out["udp_relay_mode"] = "native"
                  out["congestion_control"] = "bbr"
              elif proto == "hysteria2":
                  out["up_mbps"] = 100
                  out["down_mbps"] = 100
              add_transport(out)

          cfg = {
              "log": {"level": "info", "timestamp": True},
              "inbounds": [{"type": "socks", "tag": "socks-in", "listen": "127.0.0.1", "listen_port": 1080}],
              "outbounds": [out],
          }
          with open("/tmp/sb_config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
          PYEOF

          echo "[2/4] 下载 sing-box ..."
          SB_VERSION="1.10.7"
          SB_URL="https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          curl -fSL "$SB_URL" -o /tmp/sb.tar.gz
          tar -xzf /tmp/sb.tar.gz -C /tmp/
          mv /tmp/sing-box-${SB_VERSION}-linux-amd64/sing-box /tmp/sing-box
          chmod +x /tmp/sing-box

          /tmp/sing-box check -c /tmp/sb_config.json

          echo "[3/4] 启动 sing-box ..."
          nohup /tmp/sing-box run -c /tmp/sb_config.json > /tmp/sb.log 2>&1 &
          sleep 5

          # 注意：仅设置专用的 FALIX_PROXY，严禁注入 ALL_PROXY / HTTP_PROXY 到全局 GITHUB_ENV
          if curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://www.google.com -o /dev/null; then
            echo "FALIX_PROXY=socks5://127.0.0.1:1080" >> $GITHUB_ENV
            echo "[OK] 代理已就绪"
          else
            echo "[错误] 代理连接失败"
            cat /tmp/sb.log 2>/dev/null || true
            exit 1
          fi

      - name: 🔐 校验必需的 Secrets
        env:
          FALIX_SERVER_IDS: ${{ secrets.FALIX_SERVER_IDS }}
          FALIX_STORAGE_STATE: ${{ secrets.FALIX_STORAGE_STATE }}
        shell: bash
        run: |
          set -e
          [ -z "$FALIX_SERVER_IDS" ] && { echo "::error::缺少 FALIX_SERVER_IDS"; exit 1; }
          [ -z "$FALIX_STORAGE_STATE" ] && { echo "::error::缺少 FALIX_STORAGE_STATE"; exit 1; }
          echo "Secrets 校验通过"

      - name: 📥 还原 Falix 登录会话 (storage_state)
        env:
          FALIX_STORAGE_STATE: ${{ secrets.FALIX_STORAGE_STATE }}
        shell: bash
        run: |
          set -e
          rm -f falix_state.json
          if printf '%s' "$FALIX_STORAGE_STATE" | base64 --decode > falix_state.json 2>/dev/null; then
            python3 -c "import json; json.load(open('falix_state.json'))" 2>/dev/null || printf '%s' "$FALIX_STORAGE_STATE" > falix_state.json
          else
            printf '%s' "$FALIX_STORAGE_STATE" > falix_state.json
          fi
          echo "storage_state 写入完成"

      - name: 🔍 强类型清洗与规范化 storage_state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("falix_state.json")
          try:
              raw = json.loads(path.read_text(encoding="utf-8"))
          except Exception as e:
              print(f"::error::storage_state JSON 解析失败: {e}")
              raise SystemExit(1)

          data = {"cookies": raw, "origins": []} if isinstance(raw, list) else raw

          cleaned = []
          for c in data.get("cookies", []):
              ss = str(c.get("sameSite", "")).lower()
              if ss in ("strict",):
                  same_site = "Strict"
              elif ss in ("none", "no_restriction"):
                  same_site = "None"
              else:
                  same_site = "Lax"

              expires = c.get("expires", c.get("expirationDate", -1))
              try:
                  expires = float(expires) if expires is not None else -1.0
              except (ValueError, TypeError):
                  expires = -1.0

              cleaned.append({
                  "name": str(c.get("name", "")),
                  "value": str(c.get("value", "")),
                  "domain": str(c.get("domain", "")),
                  "path": str(c.get("path", "/")),
                  "expires": expires,
                  "httpOnly": bool(c.get("httpOnly", False)),
                  "secure": bool(c.get("secure", False)),
                  "sameSite": same_site
              })

          data["cookies"] = cleaned
          data["origins"] = data.get("origins", [])
          path.write_text(json.dumps(data, indent=2), encoding="utf-8")
          print(f"✅ storage_state 强校验完成，清洗 Cookie: {len(cleaned)} 个")
          PY

      - name: 🐛 准备调试输出目录
        run: |
          mkdir -p debug_output
          rm -f debug_output/* || true

      - name: 🔄 运行 Falix 续期脚本
        id: renew
        env:
          FALIX_SERVER_IDS: ${{ secrets.FALIX_SERVER_IDS }}
          FALIX_STORAGE_STATE: falix_state.json
          RENEW_BELOW_MINUTES: "20"
          HEADLESS: "true"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python renew.py

      - name: 📝 生成运行摘要
        if: always()
        shell: bash
        run: |
          {
            echo "# Falix Renew Pro 运行摘要"
            echo "- 运行编号: #${{ github.run_number }}"
            echo "- 状态: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📸 上传调试截图与 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falix-debug-${{ github.run_number }}
          path: debug_output/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧹 清理敏感 storage_state 文件
        if: always()
        shell: bash
        run: |
          rm -f falix_state.json
          echo "敏感 storage_state 文件已清理."
